services:
  signaling:
    build: .
    expose:
      - "3000"
    environment:
      # LISTEN_ADDR: "0.0.0.0:3000" # 待ち受けアドレス変更時はexposeも合わせて変更する
      MAX_ROOMS: "10"
      # coturn(network_mode: host)のprometheusをコンテナ内部から読む。
      #必ずファイアウォール等で外部からの接続を断つこと
      TURN_METRICS_URL: "http://host.docker.internal:9641/metrics"
      
      TURN_SECRET: ${TURN_SECRET}
      TURN_HOST: turn.kotukoroom.net
      TURN_TTL_SECS: "21600"
    extra_hosts:
      # host.docker.internal をホスト(=coturnの待ち受け先)に解決させる
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  caddy:
    image: docker.io/library/caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    restart: unless-stopped

  coturn:
    image: docker.io/coturn/coturn:4.14.0-alpine
    network_mode: host
    depends_on:
      - caddy
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      - caddy_data:/caddy-data:ro
    environment:
      # --static-auth-secret でコマンドラインに出さず、環境変数経由でturnserverに渡す
      TURN_SECRET: ${TURN_SECRET}
    # 1) 証明書ができるまで待ってから起動
    # 2) 約7日ごとに自己終了し、restart で Caddy が更新した新しい証明書を読み直す
    #    (coturnは証明書をホットリロードしないため、再起動でしか更新を反映できない)
    entrypoint:
      - /bin/sh
      - -c
      - |
        cert=/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/turn.kotukoroom.net/turn.kotukoroom.net.crt
        until [ -f "$$cert" ]; do
          echo "waiting for TLS cert: $$cert"
          sleep 5
        done
        exec timeout 604800 turnserver -c /etc/coturn/turnserver.conf --static-auth-secret="$$TURN_SECRET"
    restart: unless-stopped

volumes:
  caddy_data: