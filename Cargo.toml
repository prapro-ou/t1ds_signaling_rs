[package]
name = "t1ds_signaling_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
dashmap = "6.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
# coturnのprometheusメトリクスを内部HTTPで取得するためだけに使う(TLS不要なのでdefault-features=false)
reqwest = { version = "0.12", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hmac = "0.13.0"
sha1 = "0.11.0"
base64 = "0.22.1"

[dev-dependencies]
tokio-tungstenite = "0.29"
